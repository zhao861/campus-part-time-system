spring:
  application:
    name: jobManager
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/jobmanager
    username: root
    password: 
mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
ai:
  audit:
    enabled: true
    base-url: https://api.deepseek.com
    api-key: ${AI_API_KEY:}
    model: deepseek-chat
    timeout-seconds: 8
    response-format-json: false
    low-pass-threshold: low
